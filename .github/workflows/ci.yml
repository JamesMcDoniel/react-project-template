name: Test & Lint

on:
  push:
  pull_request:
    branches:
      - $default-branch

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node@18
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 18

      - name: Get npm cache
        id: npm-cache
        shell: bash
        run: echo "CACHE_DIR=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.npm-cache.outputs.CACHE_DIR }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest
        run: npm run test --if-present

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node@18
        uses: actions/setup-node@v4
        with:
          cache: 'npm'
          node-version: 18

      - name: Get npm cache
        id: npm-cache
        shell: bash
        run: echo "CACHE_DIR=$(npm config get cache)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ${{ steps.npm-cache.outputs.CACHE_DIR }}
          key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-
            ${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint --if-present

      - name: Run Stylelint
        run: npm run stylelint --if-present
